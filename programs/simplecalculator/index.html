<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(100%, 380px);
      padding: 28px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgb(15 23 42 / 12%);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 1.7rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      border-color: #2563eb;
      outline: 2px solid rgb(37 99 235 / 20%);
    }

    .operations {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .clear-button {
      width: 100%;
      min-height: 42px;
      margin-top: 12px;
      background: #e2e8f0;
      color: #172033;
      font-size: 1rem;
    }

    .clear-button:hover {
      background: #cbd5e1;
    }

    .result {
      min-height: 54px;
      margin: 22px 0 0;
      padding: 14px;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Simple Calculator</h1>

    <div class="field">
      <label for="first-number">First number</label>
      <input id="first-number" type="number" step="any" placeholder="Enter a number">
    </div>

    <div class="field">
      <label for="second-number">Second number</label>
      <input id="second-number" type="number" step="any" placeholder="Enter a number">
    </div>

    <div class="operations" aria-label="Calculator operations">
      <button type="button" data-operation="add" aria-label="Add">+</button>
      <button type="button" data-operation="subtract" aria-label="Subtract">−</button>
      <button type="button" data-operation="multiply" aria-label="Multiply">×</button>
      <button type="button" data-operation="divide" aria-label="Divide">÷</button>
    </div>

    <button class="clear-button" id="clear-button" type="button">Clear</button>
    <p class="result" id="result" role="status" aria-live="polite">Result will appear here.</p>
  </main>

  <script>
    const firstNumber = document.querySelector("#first-number");
    const secondNumber = document.querySelector("#second-number");
    const result = document.querySelector("#result");

    document.querySelector(".operations").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-operation]");
      if (!button) return;

      if (firstNumber.value.trim() === "" || secondNumber.value.trim() === "") {
        result.textContent = "Please enter both numbers.";
        return;
      }

      const first = Number(firstNumber.value);
      const second = Number(secondNumber.value);
      let answer;

      switch (button.dataset.operation) {
        case "add":
          answer = first + second;
          break;
        case "subtract":
          answer = first - second;
          break;
        case "multiply":
          answer = first * second;
          break;
        case "divide":
          if (second === 0) {
            result.textContent = "Cannot divide by zero.";
            return;
          }
          answer = first / second;
          break;
      }

      result.textContent = `Result: ${answer}`;
    });

    document.querySelector("#clear-button").addEventListener("click", () => {
      firstNumber.value = "";
      secondNumber.value = "";
      result.textContent = "Result will appear here.";
      firstNumber.focus();
    });
  </script>
</body>
</html>
