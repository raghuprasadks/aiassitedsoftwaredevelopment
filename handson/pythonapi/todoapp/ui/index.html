<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>Todo Board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Todo Board home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>todo<span class="brand-light">board</span></span>
      </a>
      <span class="topbar-note"><span class="live-dot"></span> A calmer way to get things done</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">YOUR WORKSPACE</p>
      <div class="intro-row">
        <div>
          <h1 id="page-title">Things to do<span class="heading-period">.</span></h1>
          <p class="subtitle">Make space for what matters. One task at a time.</p>
        </div>
        <button class="primary-button" id="add-todo-button" type="button">
          <span aria-hidden="true">＋</span> New task
        </button>
      </div>
    </section>

    <section class="stats" aria-label="Todo summary">
      <article class="stat-card">
        <span class="stat-icon total-icon" aria-hidden="true">☷</span>
        <div><p class="stat-label">Total tasks</p><p class="stat-value" id="total-count">—</p></div>
      </article>
      <article class="stat-card">
        <span class="stat-icon done-icon" aria-hidden="true">✓</span>
        <div><p class="stat-label">Completed</p><p class="stat-value" id="completed-count">—</p></div>
      </article>
      <article class="stat-card">
        <span class="stat-icon pending-icon" aria-hidden="true">◷</span>
        <div><p class="stat-label">Still to do</p><p class="stat-value" id="pending-count">—</p></div>
      </article>
    </section>

    <section class="todo-panel" aria-labelledby="list-heading">
      <div class="panel-heading">
        <div>
          <h2 id="list-heading">Your tasks</h2>
          <p class="list-caption" id="list-caption">Loading your todo list…</p>
        </div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Search tasks" autocomplete="off" aria-label="Search tasks">
          <kbd>/</kbd>
        </label>
      </div>

      <div class="toolbar">
        <div class="filter-tabs" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All <span id="all-filter-count">—</span></button>
          <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <label class="sort-control">
          <span>Sort by</span>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="id-asc">Oldest</option>
            <option value="id-desc">Newest</option>
            <option value="title-asc">A to Z</option>
            <option value="title-desc">Z to A</option>
          </select>
        </label>
      </div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="loading-state" id="loading-state">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading your tasks…</span>
      </div>
      <ul class="todo-list" id="todo-list" aria-label="Todo items"></ul>

      <footer class="list-footer">
        <p id="page-summary">—</p>
        <nav class="pagination" aria-label="Todo list pages">
          <button id="previous-page" type="button" aria-label="Previous page" disabled>‹</button>
          <span id="page-indicator">1 / 1</span>
          <button id="next-page" type="button" aria-label="Next page" disabled>›</button>
        </nav>
      </footer>
    </section>
  </main>

  <dialog class="todo-dialog" id="todo-dialog" aria-labelledby="dialog-title">
    <form id="todo-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">TODO BOARD</p>
          <h2 id="dialog-title">Create a task</h2>
        </div>
        <button class="icon-button" id="close-dialog-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <label class="field-label" for="todo-title">Task title</label>
      <textarea id="todo-title" name="title" rows="3" maxlength="500" required placeholder="What would you like to get done?"></textarea>
      <label class="field-label" for="todo-user">User ID</label>
      <input id="todo-user" name="userId" type="number" min="1" step="1" value="1" required>
      <label class="checkbox-field" id="completed-field" hidden>
        <input id="todo-completed" name="completed" type="checkbox">
        <span>Mark as completed</span>
      </label>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="secondary-button" id="cancel-dialog-button" type="button">Cancel</button>
        <button class="primary-button" id="save-todo-button" type="submit">Create task</button>
      </div>
    </form>
  </dialog>
</body>
</html>
