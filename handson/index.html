<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131f">
    <title>Math Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Math calculator">
        <header class="calculator-header">
            <h1>Math Calculator</h1>
            <span class="keyboard-hint">Keyboard supported</span>
        </header>

        <section class="display" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </section>

        <div class="keys" aria-label="Calculator keys">
            <button class="utility" type="button" data-action="clear" aria-label="Clear all">AC</button>
            <button class="utility" type="button" data-action="sign" aria-label="Change sign">+/-</button>
            <button class="utility" type="button" data-action="percent" aria-label="Percent">%</button>
            <button class="operator" type="button" data-action="operator" data-value="/" aria-label="Divide">÷</button>

            <button type="button" data-action="digit" data-value="7">7</button>
            <button type="button" data-action="digit" data-value="8">8</button>
            <button type="button" data-action="digit" data-value="9">9</button>
            <button class="operator" type="button" data-action="operator" data-value="*" aria-label="Multiply">×</button>

            <button type="button" data-action="digit" data-value="4">4</button>
            <button type="button" data-action="digit" data-value="5">5</button>
            <button type="button" data-action="digit" data-value="6">6</button>
            <button class="operator" type="button" data-action="operator" data-value="-" aria-label="Subtract">−</button>

            <button type="button" data-action="digit" data-value="1">1</button>
            <button type="button" data-action="digit" data-value="2">2</button>
            <button type="button" data-action="digit" data-value="3">3</button>
            <button class="operator" type="button" data-action="operator" data-value="+" aria-label="Add">+</button>

            <button class="utility" type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
            <button type="button" data-action="digit" data-value="0">0</button>
            <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
