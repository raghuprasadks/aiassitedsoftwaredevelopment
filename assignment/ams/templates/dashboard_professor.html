{% extends "base.html" %}
{% block title %}Professor Dashboard | BMSIT AMS{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div><p class="text-secondary mb-1">Professor portal</p><h1 class="h2 mb-0">Assignments</h1></div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignmentModal">Create Assignment</button>
</div>
<div class="card"><div class="card-header bg-white fw-bold">Manage assignments</div>
  <div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>Title</th><th>Subject</th><th>Status</th><th>Due</th><th>Actions</th></tr></thead>
    <tbody id="professor-assignment-list"><tr><td colspan="5" class="text-center py-4">Loading...</td></tr></tbody>
  </table></div>
</div>
<div class="modal fade" id="assignmentModal" tabindex="-1">
  <div class="modal-dialog modal-lg"><form class="modal-content" id="assignment-form">
    <div class="modal-header"><h2 class="modal-title fs-5">Create Assignment</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body row g-3">
      <div class="col-md-6"><label class="form-label" for="offering">Course Offering ID</label><input class="form-control" id="offering" type="number" value="1" required></div>
      <div class="col-md-6"><label class="form-label" for="max-marks">Maximum marks</label><input class="form-control" id="max-marks" type="number" min="0.01" step="0.01" required></div>
      <div class="col-12"><label class="form-label" for="assignment-title">Title</label><input class="form-control" id="assignment-title" maxlength="200" required></div>
      <div class="col-12"><label class="form-label" for="assignment-description">Description</label><textarea class="form-control" id="assignment-description"></textarea></div>
      <div class="col-12"><label class="form-label" for="assignment-instructions">Instructions</label><textarea class="form-control" id="assignment-instructions"></textarea></div>
      <div class="col-md-8"><label class="form-label" for="due-date">Deadline</label><input class="form-control" id="due-date" type="datetime-local" required></div>
      <div class="col-md-4 d-flex align-items-end gap-3">
        <div class="form-check"><input class="form-check-input" id="allow-late" type="checkbox"><label class="form-check-label" for="allow-late">Late</label></div>
        <div class="form-check"><input class="form-check-input" id="allow-resubmit" type="checkbox" checked><label class="form-check-label" for="allow-resubmit">Resubmit</label></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" type="submit">Save draft</button></div>
  </form></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/professor.js') }}"></script>
{% endblock %}
