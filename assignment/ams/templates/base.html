<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}BMSIT AMS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/dashboard">BMSIT AMS</a>
      <div class="d-flex align-items-center text-white gap-3">
        <span id="nav-name"></span>
        <button class="btn btn-outline-light btn-sm" id="logout-button">Logout</button>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="{% if current_user.is_authenticated %}container py-4{% else %}{% endif %}">
    {% block content %}{% endblock %}
  </main>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
